name: Migrate existing signing key to encrypted CI bundle

on:
  workflow_dispatch:
  push:
    branches:
      - experimental/call-only-remote-notifications
    paths:
      - '.github/workflows/migrate-signing.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.repository == 'N2K02/PCL'
    runs-on: ubuntu-latest
    env:
      SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Encrypt and verify existing signing identity
        shell: bash
        run: |
          set -euo pipefail
          : "${SIGNING_PASSPHRASE:?SIGNING_PASSPHRASE repository secret is required}"
          test -s app/debug.keystore
          mkdir -p signing
          umask 077
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          cp app/debug.keystore "$tmp/old.keystore"
          (cd "$tmp" && tar -cf - old.keystore) |
            openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
              -pass env:SIGNING_PASSPHRASE -out signing/keys.tar.enc
          mkdir -p "$tmp/check"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -pass env:SIGNING_PASSPHRASE -in signing/keys.tar.enc |
            tar -xf - -C "$tmp/check"
          cmp -s app/debug.keystore "$tmp/check/old.keystore" ||
            { echo "::error::Restored signing key differs from the existing key"; exit 1; }
          echo "Encrypted key verified against original signing identity"
      - name: Commit encrypted bundle and remove tracked plaintext keystore
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signing/keys.tar.enc
          git rm app/debug.keystore
          git commit -m "Migrate existing signing identity to encrypted CI bundle"
          git push origin "HEAD:${GITHUB_REF_NAME}"
