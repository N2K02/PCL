name: One-time delete non-main branches
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-delete-non-main.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const branches = await github.paginate(github.rest.repos.listBranches, {owner, repo, per_page: 100});
            for (const {name} of branches) {
              if (name === 'main') continue;
              try {
                await github.rest.git.deleteRef({owner, repo, ref: 'heads/' + name});
                core.info('Deleted: ' + name);
              } catch (error) {
                if (error.status === 404) { core.info('Already deleted: ' + name); continue; }
                core.error('Failed to delete ' + name + ': ' + error.message);
                throw error;
              }
            }
            const remaining = (await github.paginate(github.rest.repos.listBranches, {owner, repo, per_page: 100})).filter(b => b.name !== 'main');
            if (remaining.length) throw new Error('Remaining branches: ' + remaining.map(b => b.name).join(', '));
            core.info('Only main remains.');
