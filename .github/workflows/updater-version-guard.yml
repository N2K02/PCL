name: Guard shared updater compatibility

on: [pull_request, push, workflow_dispatch]

permissions:
  contents: read

jobs:
  updater-version:
    # The job name is kept so existing required-check settings still match.
    name: Require n2k02updater 0.1.19+
    runs-on: ubuntu-latest
    env:
      N2K02_PACKAGES_TOKEN: ${{ secrets.N2K02_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # One authoritative check: the same Gradle task every Android build runs before compiling.
      - name: Verify pinned updater version
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon verifySharedUpdaterVersion
