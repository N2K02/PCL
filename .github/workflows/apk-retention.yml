name: APK release and workflow retention
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apk-retention.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: write
  actions: write
jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Keep latest stable and experimental APKs; prune obsolete runs
        uses: actions/github-script@v9
        with:
          script: |
            const {owner, repo} = context.repo;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            const rateOk = async () => {
              const {data} = await github.rest.rateLimit.get();
              const remaining = data.resources.core.remaining;
              core.info('GitHub core API remaining: ' + remaining);
              return remaining > 250;
            };
            if (!(await rateOk())) {
              core.warning('Rate limit too low; leaving everything unchanged.');
              return;
            }
            const releases = await github.paginate(github.rest.repos.listReleases, {owner, repo, per_page: 100});
            const apkReleases = releases
              .filter(r => !r.draft && r.assets.some(a => a.name.toLowerCase().endsWith('.apk')))
              .sort((a, b) => Date.parse(b.published_at || b.created_at) - Date.parse(a.published_at || a.created_at));
            const keptRelease = new Map();
            for (const release of apkReleases) {
              const channel = release.prerelease ? 'experimental' : 'stable';
              if (!keptRelease.has(channel)) keptRelease.set(channel, release.id);
            }
            core.info('Kept release IDs: ' + JSON.stringify(Object.fromEntries(keptRelease)));
            let removedReleases = 0;
            for (const release of apkReleases) {
              const channel = release.prerelease ? 'experimental' : 'stable';
              if (release.id === keptRelease.get(channel)) continue;
              if (removedReleases >= 150 || !(await rateOk())) break;
              await github.rest.repos.deleteRelease({owner, repo, release_id: release.id});
              removedReleases++;
              await sleep(180);
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {owner, repo, per_page: 100});
            runs.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
            const keepRuns = new Set([context.runId]);
            const keptBuildChannels = new Set();
            for (const run of runs) {
              if (run.status !== 'completed') {
                keepRuns.add(run.id);
                continue;
              }
              if (run.conclusion !== 'success') continue;
              if (!/(build|apk|assemble|release)/i.test(run.name + ' ' + run.path)) continue;
              const channel = run.event === 'pull_request' || run.event === 'pull_request_target' || /experimental/i.test(run.head_branch || '') ? 'experimental' : 'stable';
              if (!keptBuildChannels.has(channel)) {
                keepRuns.add(run.id);
                keptBuildChannels.add(channel);
              }
            }
            core.info('Preserved build run IDs: ' + [...keepRuns].join(','));
            let removedRuns = 0;
            for (const run of runs) {
              if (keepRuns.has(run.id) || run.status !== 'completed') continue;
              if (removedRuns >= 300) { core.warning('Batch limit reached; remaining runs will be cleaned by a later scheduled run.'); break; }
              if (removedRuns % 25 === 0 && !(await rateOk())) break;
              try {
                await github.rest.actions.deleteWorkflowRun({owner, repo, run_id: run.id});
                removedRuns++;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              await sleep(120);
            }
            core.info('Removed APK releases: ' + removedReleases + '; removed completed workflow runs: ' + removedRuns);
