name: Delete merged PR branches
on:
  pull_request_target:
    types: [closed]
permissions:
  contents: write
  pull-requests: read
jobs:
  delete-merged-branch:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged branch if safe
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const {owner, repo} = context.repo;
            const branch = pr.head.ref;
            if (!branch || branch === 'main' || branch === context.payload.repository.default_branch) return;
            const {data: protectedBranch} = await github.rest.repos.getBranch({owner, repo, branch});
            if (protectedBranch.protected) {
              core.info('Preserving protected branch: ' + branch);
              return;
            }
            const {data: openPRs} = await github.rest.pulls.list({owner, repo, state: 'open', head: owner + ':' + branch, per_page: 100});
            if (openPRs.length) {
              core.info('Preserving branch with open PRs: ' + branch);
              return;
            }
            try {
              await github.rest.git.deleteRef({owner, repo, ref: 'heads/' + branch});
              core.info('Deleted merged PR branch: ' + branch);
            } catch (error) {
              if (error.status === 404 || error.status === 422) {
                core.info('Branch already deleted or protected: ' + branch);
              } else {
                throw error;
              }
            }
