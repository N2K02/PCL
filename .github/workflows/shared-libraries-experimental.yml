name: Shared libraries experimental
on:
  push:
    branches: [experimental/shared-libraries]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
      - name: Compile experimental APK
        env:
          N2K02_PACKAGES_TOKEN: ${{ secrets.N2K02_PACKAGES_TOKEN }}
        run: |
          test -n "$N2K02_PACKAGES_TOKEN" || { echo "::error::N2K02_PACKAGES_TOKEN secret is missing"; exit 1; }
          gradle --no-daemon :app:assembleDebug -PuseN2K02Libraries=true
      - uses: actions/upload-artifact@v7
        with:
          name: PCL-experimental-shared-libraries
          path: app/build/outputs/apk/debug/*.apk
