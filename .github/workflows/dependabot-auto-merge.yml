name: Strict Dependabot auto-merge
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  check_suite:
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
concurrency:
  group: dependabot-strict-merge
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const prs = await github.paginate(github.rest.pulls.list, {owner, repo, state: 'open', per_page: 100});
            for (const candidate of prs) {
              if (candidate.user.login !== 'dependabot[bot]' || candidate.draft || candidate.base.ref !== 'main' || !candidate.head.ref.startsWith('dependabot/')) continue;
              try {
                const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: candidate.number});
                if (pr.mergeable !== true) continue;
                const sha = pr.head.sha;
                const checks = await github.paginate(github.rest.checks.listForRef, {owner, repo, ref: sha, per_page: 100}, r => r.data.check_runs);
                const {data: statuses} = await github.rest.repos.getCombinedStatusForRef({owner, repo, ref: sha});
                if (!checks.length || !checks.some(c => /build|test|validate|guard|compile|lint|ci/i.test(c.name))) continue;
                if (checks.some(c => c.status !== 'completed' || c.conclusion !== 'success')) continue;
                if (statuses.statuses.some(s => s.state !== 'success')) continue;
                const {data: fresh} = await github.rest.pulls.get({owner, repo, pull_number: pr.number});
                if (fresh.head.sha !== sha || fresh.mergeable !== true || fresh.draft || fresh.base.ref !== 'main') continue;
                await github.rest.pulls.merge({owner, repo, pull_number: pr.number, sha, merge_method: 'squash'});
                core.info('Merged Dependabot PR #' + pr.number);
              } catch (e) { core.warning('PR #' + candidate.number + ' remains open: ' + e.message); }
            }
